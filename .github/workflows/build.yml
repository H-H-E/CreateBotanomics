name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 21 / CC ${{ matrix.computercraft }} / Lanterns ${{ matrix.lanterns }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        computercraft: ['true', 'false']
        lanterns: ['false', 'true']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build and run pure-rule tests
        run: ./gradlew build --no-daemon -PwithComputerCraft=${{ matrix.computercraft }} -PwithLanterns=${{ matrix.lanterns }}
      - name: Run actual Minecraft integration tests
        run: ./gradlew runGameTestServer --no-daemon -PwithComputerCraft=${{ matrix.computercraft }} -PwithLanterns=${{ matrix.lanterns }}
      - name: Package client pack and server kit
        if: matrix.computercraft == 'true' && matrix.lanterns == 'false'
        run: python3 scripts/package_release.py
      - name: Upload installable artifacts
        if: matrix.computercraft == 'true' && matrix.lanterns == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: createbattlebots-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/distributions/*
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-cc-${{ matrix.computercraft }}-lanterns-${{ matrix.lanterns }}
          path: |
            build/reports/tests/
            build/test-results/
            run/gametest/logs/
            run/gametest/crash-reports/
          if-no-files-found: warn

