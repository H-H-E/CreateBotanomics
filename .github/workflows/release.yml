name: GitHub release

on:
  push:
    branches: [main]
    paths: ['gradle.properties']
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: github-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select a new, immutable release version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/release_context.py
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: steps.version.outputs.should_publish == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        if: steps.version.outputs.should_publish == 'true'
      - name: Verify version, compile, and test
        if: steps.version.outputs.should_publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew verifyReleaseVersion build runGameTestServer --no-daemon -PreleaseModVersion="$RELEASE_VERSION"
          ./gradlew runGameTestServer --no-daemon -PwithComputerCraft=false
          python3 scripts/package_release.py
      - name: Recheck publication has not already happened
        id: publish_guard
        if: steps.version.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/release_context.py
      - name: Publish tested GitHub assets
        if: steps.publish_guard.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            build/libs/createbattlebots-*.jar
            build/distributions/*
          fail_on_unmatched_files: true
          overwrite_files: false
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
